<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Geometry Dash - Update 2.2 Authentic Physics</title>
    <style>
        body {
            margin: 0;
            background-color: #0b132b;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            color: white;
            font-family: Arial, sans-serif;
            overflow: hidden;
        }
        .screen {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
        }
        .hidden {
            display: none !important;
        }
        canvas {
            border: 4px solid #48cae4;
            box-shadow: 0 0 25px rgba(72, 202, 228, 0.4);
        }
        .menu-box {
            background: #1d3557;
            padding: 20px 30px;
            border-radius: 12px;
            border: 2px solid #457b9d;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            max-width: 550px;
            max-height: 90vh;
            overflow-y: auto;
        }
        h1 { margin-bottom: 10px; color: #48cae4; text-shadow: 0 0 10px rgba(72,202,228,0.5); font-size: 24px; }
        h3 { margin: 8px 0 5px 0; color: #a8dadc; font-size: 14px; }
        .grid-container {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
            margin-bottom: 10px;
        }
        .options-container {
            display: flex;
            gap: 8px;
            justify-content: center;
            margin-bottom: 8px;
            flex-wrap: wrap;
        }
        .btn-option {
            padding: 8px 10px;
            background-color: #2b2b3d;
            border: 2px solid #fff;
            border-radius: 6px;
            cursor: pointer;
            transition: transform 0.2s, border-color 0.2s;
            font-size: 12px;
            font-weight: bold;
            color: #fff;
        }
        .btn-option:hover {
            transform: scale(1.05);
        }
        .btn-option.selected {
            border-color: #ffb703;
            background-color: #3b3b5c;
            box-shadow: 0 0 8px #ffb703;
        }
        .color-circle {
            width: 35px;
            height: 35px;
            border: 3px solid #fff;
            border-radius: 50%;
            cursor: pointer;
        }
        .color-circle.selected {
            border-color: #ffb703;
            box-shadow: 0 0 10px #ffb703;
        }
        .start-btn {
            background-color: #48cae4;
            color: #03045e;
            font-weight: bold;
            font-size: 16px;
            padding: 10px 25px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            margin-top: 10px;
            transition: background 0.2s;
        }
        .start-btn:hover {
            background-color: #00b4d8;
        }
    </style>
</head>
<body>

    <!-- MÀN HÌNH CHỌN PHƯƠNG TIỆN -->
    <div id="menuScreen" class="screen menu-box">
        <h1>BACK ON TRACK - 2.2 GARAGE</h1>
        
        <h3>Chọn Phương Tiện:</h3>
        <div class="grid-container" id="shapeOptions">
            <div class="btn-option selected" data-shape="cube">🟦 Cube</div>
            <div class="btn-option" data-shape="ship">🚀 Ship</div>
            <div class="btn-option" data-shape="ball">🔮 Ball</div>
            <div class="btn-option" data-shape="ufo">🛸 UFO</div>
            <div class="btn-option" data-shape="wave">⚡ Wave</div>
            <div class="btn-option" data-shape="robot">🤖 Robot</div>
            <div class="btn-option" data-shape="spider">🕷️ Spider</div>
            <div class="btn-option" data-shape="swing">🪂 Swing</div>
            <div class="btn-option" data-shape="jetpack">🎒 Jetpack</div>
        </div>

        <h3>Chọn Màu Sắc Chủ Đạo:</h3>
        <div class="options-container" id="colorOptions">
            <div class="color-circle selected" style="background-color: #00ffcc;" data-color="#00ffcc"></div>
            <div class="color-circle" style="background-color: #ff3366;" data-color="#ff3366"></div>
            <div class="color-circle" style="background-color: #ffcc00;" data-color="#ffcc00"></div>
            <div class="color-circle" style="background-color: #9933ff;" data-color="#9933ff"></div>
            <div class="color-circle" style="background-color: #ff6600;" data-color="#ff6600"></div>
        </div>

        <button class="start-btn" onclick="startGame()">VÀO MÀN CHƠI</button>
    </div>

    <!-- MÀN HÌNH CHƠI GAME -->
    <div id="gameScreen" class="screen hidden">
        <canvas id="gameCanvas" width="800" height="400"></canvas>
    </div>

    <script>
        const menuScreen = document.getElementById("menuScreen");
        const gameScreen = document.getElementById("gameScreen");
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");

        let selectedVehicle = "cube";
        let selectedColor = "#00ffcc";
        let particleEffects = [];
        let isHoldingAction = false;

        document.querySelectorAll("#shapeOptions .btn-option").forEach(btn => {
            btn.addEventListener("click", function() {
                document.querySelectorAll("#shapeOptions .btn-option").forEach(b => b.classList.remove("selected"));
                this.classList.add("selected");
                selectedVehicle = this.getAttribute("data-shape");
            });
        });

        document.querySelectorAll("#colorOptions .color-circle").forEach(btn => {
            btn.addEventListener("click", function() {
                document.querySelectorAll("#colorOptions .color-circle").forEach(b => b.classList.remove("selected"));
                this.classList.add("selected");
                selectedColor = this.getAttribute("data-color");
            });
        });

        let player = {
            x: 100,
            y: 250,
            size: 32,
            dy: 0,
            grounded: false,
            rotation: 0
        };

        let obstacles = [];
        let obstacleTimer = 0;
        let obstacleInterval = 90;
        let gameSpeed = 6.2;
        let score = 0;
        let winningScore = 30;
        let isGameOver = false;
        let isGameWon = false;
        let gameRunning = false;

        function startGame() {
            menuScreen.classList.add("hidden");
            gameScreen.classList.remove("hidden");
            resetGame();
            gameRunning = true;
            loop();
        }

        // Xử lý phím bấm xuống (Giữ phím để bay đối với Ship/Jetpack)
        window.addEventListener("keydown", function(e) {
            if (e.code === "Space") {
                e.preventDefault();
                if (gameRunning) {
                    isHoldingAction = true;
                    triggerAction();
                }
            }
        });

        window.addEventListener("keyup", function(e) {
            if (e.code === "Space") {
                isHoldingAction = false;
            }
        });

        canvas.addEventListener("mousedown", function() {
            if (gameRunning) {
                isHoldingAction = true;
                triggerAction();
            }
        });

        window.addEventListener("mouseup", function() {
            isHoldingAction = false;
        });

        function triggerAction() {
            if (isGameOver || isGameWon) {
                resetGame();
                return;
            }

            // Phân loại cơ chế điều khiển tùy theo phương tiện
            if (selectedVehicle === "cube") {
                if (player.grounded) {
                    player.dy = -13.5;
                    player.grounded = false;
                }
            } else if (selectedVehicle === "ufo") {
                // UFO nhảy đúp giữa không trung
                player.dy = -9.5;
            } else if (selectedVehicle === "spider") {
                // Nhện dịch chuyển ngược chiều
                player.y = player.y > 200 ? 100 : 300;
            }
        }

        function resetGame() {
            obstacles = [];
            particleEffects = [];
            score = 0;
            gameSpeed = 6.2;
            obstacleInterval = 90;
            player.y = 250;
            player.dy = 0;
            isGameOver = false;
            isGameWon = false;
        }

        function spawnObstacle() {
            const rand = Math.random();
            let obs = { x: canvas.width };

            if (rand < 0.3) {
                obs.type = "singleSpike";
                obs.width = 30;
                obs.height = 35;
                obs.y = 310;
            } else if (rand < 0.55) {
                obs.type = "doubleSpike";
                obs.width = 60;
                obs.height = 35;
                obs.y = 310;
            } else {
                obs.type = "stairsPlatform";
                obs.width = 110;
                obs.height = 25;
                obs.y = 270;
            }

            obstacles.push(obs);
        }

        function update() {
            if (isGameOver || isGameWon) return;

            // Xử lý vật lý riêng biệt cho từng loại phương tiện bay (Ship, Jetpack, Wave, v.v.)
            if (selectedVehicle === "ship" || selectedVehicle === "jetpack") {
                // Giữ phím Space/Click thì bay lên, thả ra thì chìm xuống
                if (isHoldingAction) {
                    player.dy -= 0.65; // Lực đẩy lên
                } else {
                    player.dy += 0.65; // Trọng lực kéo xuống
                }
                // Giới hạn tốc độ bay tối đa
                if (player.dy < -8) player.dy = -8;
                if (player.dy > 8) player.dy = 8;
                player.y += player.dy;
                player.rotation = player.dy * 4;
            } 
            else if (selectedVehicle === "wave") {
                // Wave bay zíc-zắc cực nhanh
                if (isHoldingAction) {
                    player.dy = -7;
                } else {
                    player.dy = 7;
                }
                player.y += player.dy;
                player.rotation = isHoldingAction ? -45 : 45;
            } 
            else if (selectedVehicle === "swing") {
                // Swing Copter đảo trọng lực khi bấm
                if (isHoldingAction && player.grounded) {
                    player.dy = -player.dy;
                }
                player.dy += 0.85;
                player.y += player.dy;
            }
            else {
                // Các dạng Cube, Ball, UFO, Robot, Spider dùng trọng lực tiêu chuẩn
                player.dy += 0.85;
                player.y += player.dy;
                player.rotation += 12;
            }

            const groundLevel = 340 - player.size;
            let onGround = false;

            if (player.y >= groundLevel) {
                player.y = groundLevel;
                player.dy = 0;
                onGround = true;
            }

            if (player.y <= 0) {
                player.y = 0;
                player.dy = 0;
            }

            // Hiệu ứng hạt
            if (Math.random() < 0.6) {
                particleEffects.push({
                    x: player.x,
                    y: player.y + player.size / 2,
                    size: Math.random() * 6 + 4,
                    color: selectedColor,
                    alpha: 1.0,
                    vx: -2 - Math.random() * 2,
                    vy: (Math.random() - 0.5) * 2
                });
            }

            for (let p of particleEffects) {
                p.x += p.vx;
                p.y += p.vy;
                p.alpha -= 0.04;
            }
            particleEffects = particleEffects.filter(p => p.alpha > 0);

            for (let obs of obstacles) {
                if (obs.type === "stairsPlatform" && selectedVehicle === "cube") {
                    if (
                        player.x + player.size > obs.x &&
                        player.x < obs.x + obs.width &&
                        player.y + player.size >= obs.y &&
                        player.y + player.size <= obs.y + 18 &&
                        player.dy >= 0
                    ) {
                        player.y = obs.y - player.size;
                        player.dy = 0;
                        onGround = true;
                    }
                }
            }

            if (onGround) {
                player.grounded = true;
                if (selectedVehicle === "cube") {
                    player.rotation = Math.round(player.rotation / 90) * 90;
                }
            } else {
                player.grounded = false;
            }

            obstacleTimer++;
            if (obstacleTimer >= obstacleInterval) {
                spawnObstacle();
                obstacleTimer = 0;
                if (obstacleInterval > 55) obstacleInterval -= 2;
            }

            for (let i = obstacles.length - 1; i >= 0; i--) {
                obstacles[i].x -= gameSpeed;

                let padding = 4;
                if (
                    player.x + padding < obstacles[i].x + obstacles[i].width - padding &&
                    player.x + player.size - padding > obstacles[i].x + padding &&
                    player.y + padding < obstacles[i].y + obstacles[i].height &&
                    player.y + player.size > obstacles[i].y
                ) {
                    isGameOver = true;
                }

                if (obstacles[i].x + obstacles[i].width < 0) {
                    obstacles.splice(i, 1);
                    score++;
                    if (score >= winningScore) {
                        isGameWon = true;
                    }
                    if (score % 5 === 0) gameSpeed += 0.4;
                }
            }
        }

        function drawBackground() {
            let gradient = ctx.createLinearGradient(0, 0, 0, canvas.height);
            gradient.addColorStop(0, "#03045e");
            gradient.addColorStop(1, "#0077b6");
            ctx.fillStyle = gradient;
            ctx.fillRect(0, 0, canvas.width, canvas.height);
        }

        function drawSpike(x, y, w, h) {
            ctx.fillStyle = "#023e8a";
            ctx.beginPath();
            ctx.moveTo(x, y + h);
            ctx.lineTo(x + w / 2, y);
            ctx.lineTo(x + w, y + h);
            ctx.closePath();
            ctx.fill();

            ctx.fillStyle = "#ffb703";
            ctx.beginPath();
            ctx.moveTo(x + 4, y + h);
            ctx.lineTo(x + w / 2, y + 6);
            ctx.lineTo(x + w - 4, y + h);
            ctx.closePath();
            ctx.fill();

            ctx.strokeStyle = "#ffffff";
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.moveTo(x, y + h);
            ctx.lineTo(x + w / 2, y);
            ctx.lineTo(x + w, y + h);
            ctx.closePath();
            ctx.stroke();
        }

        function drawVehicle() {
            ctx.save();
            ctx.translate(player.x + player.size / 2, player.y + player.size / 2);
            ctx.rotate((player.rotation * Math.PI) / 180);

            if (selectedVehicle === "cube") {
                ctx.fillStyle = selectedColor;
                ctx.fillRect(-player.size / 2, -player.size / 2, player.size, player.size);
                ctx.strokeStyle = "#ffffff";
                ctx.lineWidth = 3;
                ctx.strokeRect(-player.size / 2, -player.size / 2, player.size, player.size);
                ctx.fillStyle = "#ffffff";
                ctx.fillRect(-8, -8, 16, 16);
                ctx.fillStyle = selectedColor;
                ctx.fillRect(-4, -4, 8, 8);
            } 
            else if (selectedVehicle === "ship") {
                ctx.fillStyle = selectedColor;
                ctx.beginPath();
                ctx.moveTo(player.size / 2, 0);
                ctx.lineTo(-player.size / 2, -player.size / 2);
                ctx.lineTo(-player.size / 3, 0);
                ctx.lineTo(-player.size / 2, player.size / 2);
                ctx.closePath();
                ctx.fill();
                ctx.strokeStyle = "#ffffff";
                ctx.lineWidth = 2;
                ctx.stroke();
                ctx.fillStyle = "#ffaa00";
                ctx.fillRect(-player.size / 2 - 8, -4, 8, 8);
            } 
            else if (selectedVehicle === "ball") {
                ctx.fillStyle = selectedColor;
                ctx.beginPath();
                ctx.arc(0, 0, player.size / 2, 0, Math.PI * 2);
                ctx.fill();
                ctx.strokeStyle = "#ffffff";
                ctx.lineWidth = 3;
                ctx.stroke();
                ctx.fillStyle = "#ffffff";
                ctx.beginPath();
                ctx.arc(0, 0, 6, 0, Math.PI * 2);
                ctx.fill();
            } 
            else if (selectedVehicle === "ufo") {
                ctx.fillStyle = selectedColor;
                ctx.beginPath();
                ctx.ellipse(0, 0, player.size / 2, player.size / 4, 0, 0, Math.PI * 2);
                ctx.fill();
                ctx.strokeStyle = "#ffffff";
                ctx.lineWidth = 2;
                ctx.stroke();
                ctx.fillStyle = "#90e0ef";
                ctx.beginPath();
                ctx.arc(0, -4, 6, 0, Math.PI * 2);
                ctx.fill();
            } 
            else if (selectedVehicle === "wave") {
                ctx.fillStyle = selectedColor;
                ctx.beginPath();
                ctx.moveTo(player.size / 2, 0);
                ctx.lineTo(-player.size / 2, -player.size / 2);
                ctx.lineTo(-player.size / 2, player.size / 2);
                ctx.closePath();
                ctx.fill();
                ctx.strokeStyle = "#ffffff";
                ctx.lineWidth = 2;
                ctx.stroke();
            } 
            else if (selectedVehicle === "robot") {
                ctx.fillStyle = selectedColor;
                ctx.fillRect(-10, -16, 20, 24);
                ctx.strokeStyle = "#ffffff";
                ctx.lineWidth = 2;
                ctx.strokeRect(-10, -16, 20, 24);
                ctx.fillStyle = "#ff3333";
                ctx.fillRect(-6, -10, 12, 4);
            } 
            else if (selectedVehicle === "spider") {
                ctx.fillStyle = selectedColor;
                ctx.fillRect(-12, -10, 24, 20);
                ctx.strokeStyle = "#ffffff";
                ctx.lineWidth = 2;
                ctx.strokeRect(-12, -10, 24, 20);
                ctx.strokeStyle = selectedColor;
                ctx.lineWidth = 3;
                ctx.beginPath();
                ctx.moveTo(-12, 10); ctx.lineTo(-18, 16);
                ctx.moveTo(12, 10); ctx.lineTo(18, 16);
                ctx.stroke();
            } 
            else if (selectedVehicle === "swing") {
                ctx.fillStyle = selectedColor;
                ctx.beginPath();
                ctx.arc(0, 0, 14, 0, Math.PI * 2);
                ctx.fill();
                ctx.strokeStyle = "#ffffff";
                ctx.lineWidth = 2;
                ctx.stroke();
                ctx.fillStyle = "#ffb703";
                ctx.fillRect(-18, -18, 36, 4);
                ctx.fillRect(-18, 14, 36, 4);
            } 
            else if (selectedVehicle === "jetpack") {
                ctx.fillStyle = selectedColor;
                ctx.fillRect(-12, -14, 24, 28);
                ctx.strokeStyle = "#ffffff";
                ctx.lineWidth = 2;
                ctx.strokeRect(-12, -14, 24, 28);
                ctx.fillStyle = "#ff4500";
                ctx.fillRect(-16, 6, 8, 12);
                ctx.fillRect(8, 6, 8, 12);
            }

            ctx.restore();
        }

        function draw() {
            drawBackground();

            for (let p of particleEffects) {
                ctx.fillStyle = p.color;
                ctx.globalAlpha = p.alpha;
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                ctx.fill();
            }
            ctx.globalAlpha = 1.0;

            ctx.fillStyle = "#00b4d8";
            ctx.fillRect(0, 340, canvas.width, 60);
            ctx.strokeStyle = "#ffffff";
            ctx.lineWidth = 3;
            ctx.beginPath();
            ctx.moveTo(0, 340);
            ctx.lineTo(canvas.width, 340);
            ctx.stroke();

            drawVehicle();

            for (let obs of obstacles) {
                if (obs.type === "singleSpike") {
                    drawSpike(obs.x, obs.y, obs.width, obs.height);
                } 
                else if (obs.type === "doubleSpike") {
                    drawSpike(obs.x, obs.y, 30, obs.height);
                    drawSpike(obs.x + 30, obs.y, 30, obs.height);
                } 
                else if (obs.type === "stairsPlatform") {
                    ctx.fillStyle = "#023e8a";
                    ctx.fillRect(obs.x, obs.y, obs.width, obs.height);
                    ctx.strokeStyle = "#90e0ef";
                    ctx.lineWidth = 3;
                    ctx.strokeRect(obs.x, obs.y, obs.width, obs.height);

                    ctx.fillStyle = "#90e0ef";
                    ctx.fillRect(obs.x + 6, obs
