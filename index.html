<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Geometry Dash - Back on Track Final</title>
    <style>
        body {
            margin: 0;
            background-color: #0b132b;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            color: white;
            font-family: Arial, sans-serif;
            overflow: hidden;
        }
        .screen {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
        }
        .hidden {
            display: none !important;
        }
        canvas {
            border: 4px solid #48cae4;
            box-shadow: 0 0 25px rgba(72, 202, 228, 0.4);
        }
        .menu-box {
            background: #1d3557;
            padding: 25px 35px;
            border-radius: 12px;
            border: 2px solid #457b9d;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            max-width: 480px;
        }
        h1 { margin-bottom: 15px; color: #48cae4; text-shadow: 0 0 10px rgba(72,202,228,0.5); font-size: 26px; }
        h3 { margin: 12px 0 8px 0; color: #a8dadc; font-size: 15px; }
        .options-container {
            display: flex;
            gap: 12px;
            justify-content: center;
            margin-bottom: 10px;
        }
        .btn-option {
            width: 45px;
            height: 45px;
            border: 3px solid #fff;
            border-radius: 8px;
            cursor: pointer;
            transition: transform 0.2s, border-color 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
        }
        .btn-option:hover {
            transform: scale(1.1);
        }
        .btn-option.selected {
            border-color: #ffb703;
            box-shadow: 0 0 12px #ffb703;
        }
        .start-btn {
            background-color: #48cae4;
            color: #03045e;
            font-weight: bold;
            font-size: 18px;
            padding: 12px 30px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            margin-top: 15px;
            transition: background 0.2s;
        }
        .start-btn:hover {
            background-color: #00b4d8;
        }
    </style>
</head>
<body>

    <!-- MÀN HÌNH CHỌN TÙY CHỈNH -->
    <div id="menuScreen" class="screen menu-box">
        <h1>BACK ON TRACK</h1>
        
        <h3>Chọn Hình Thù Nhân Vật:</h3>
        <div class="options-container" id="shapeOptions">
            <div class="btn-option selected" style="background-color: #2b2b3d;" data-shape="cube" title="Khối Vuông">🟦</div>
            <div class="btn-option" style="background-color: #2b2b3d;" data-shape="angel" title="Khối Thiên Thần">👼</div>
            <div class="btn-option" style="background-color: #2b2b3d;" data-shape="ball" title="Quả Cầu">🔮</div>
            <div class="btn-option" style="background-color: #2b2b3d;" data-shape="superhero" title="Siêu Nhân">🦸</div>
        </div>

        <h3>Chọn Màu Chủ Đạo:</h3>
        <div class="options-container" id="colorOptions">
            <div class="btn-option selected" style="background-color: #00ffcc;" data-color="#00ffcc"></div>
            <div class="btn-option" style="background-color: #ff3366;" data-color="#ff3366"></div>
            <div class="btn-option" style="background-color: #ffcc00;" data-color="#ffcc00"></div>
            <div class="btn-option" style="background-color: #9933ff;" data-color="#9933ff"></div>
        </div>

        <h3>Chọn Màu Không Gian (Background):</h3>
        <div class="options-container" id="bgOptions">
            <div class="btn-option selected" style="background: linear-gradient(to bottom, #03045e, #0077b6);" data-bg="ocean" title="Xanh Đại Dương">🌊</div>
            <div class="btn-option" style="background: linear-gradient(to bottom, #4a0e4e, #000000);" data-bg="darkspace" title="Vũ Trụ Đen">🌌</div>
            <div class="btn-option" style="background: linear-gradient(to bottom, #833ab4, #fd1d1d);" data-bg="sunset" title="Hoàng Hôn">🌅</div>
        </div>

        <button class="start-btn" onclick="startGame()">VÀO MÀN CHƠI</button>
    </div>

    <!-- MÀN HÌNH CHƠI GAME -->
    <div id="gameScreen" class="screen hidden">
        <canvas id="gameCanvas" width="800" height="400"></canvas>
    </div>

    <script>
        const menuScreen = document.getElementById("menuScreen");
        const gameScreen = document.getElementById("gameScreen");
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");

        let selectedPlayerShape = "cube";
        let selectedPlayerColor = "#00ffcc";
        let selectedBgType = "ocean";

        document.querySelectorAll("#shapeOptions .btn-option").forEach(btn => {
            btn.addEventListener("click", function() {
                document.querySelectorAll("#shapeOptions .btn-option").forEach(b => b.classList.remove("selected"));
                this.classList.add("selected");
                selectedPlayerShape = this.getAttribute("data-shape");
            });
        });

        document.querySelectorAll("#colorOptions .btn-option").forEach(btn => {
            btn.addEventListener("click", function() {
                document.querySelectorAll("#colorOptions .btn-option").forEach(b => b.classList.remove("selected"));
                this.classList.add("selected");
                selectedPlayerColor = this.getAttribute("data-color");
            });
        });

        document.querySelectorAll("#bgOptions .btn-option").forEach(btn => {
            btn.addEventListener("click", function() {
                document.querySelectorAll("#bgOptions .btn-option").forEach(b => b.classList.remove("selected"));
                this.classList.add("selected");
                selectedBgType = this.getAttribute("data-bg");
            });
        });

        let player = {
            x: 100,
            y: 250,
            size: 32,
            dy: 0,
            jumpPower: -13.5, // Tốc độ nhảy nhanh chuẩn bản gốc
            gravity: 0.85,    // Trọng lực rơi nhanh dứt khoát
            grounded: false,
            rotation: 0
        };

        let obstacles = [];
        let obstacleTimer = 0;
        let obstacleInterval = 90;
        let gameSpeed = 6.2;
        let score = 0;
        let winningScore = 30;
        let isGameOver = false;
        let isGameWon = false;
        let gameRunning = false;

        function startGame() {
            menuScreen.classList.add("hidden");
            gameScreen.classList.remove("hidden");
            resetGame();
            gameRunning = true;
            loop();
        }

        window.addEventListener("keydown", function(e) {
            if (e.code === "Space" && gameRunning) {
                triggerAction();
            }
        });

        canvas.addEventListener("click", function() {
            if (gameRunning) {
                triggerAction();
            }
        });

        function triggerAction() {
            if (player.grounded) {
                player.dy = player.jumpPower;
                player.grounded = false;
            }
            if (isGameOver || isGameWon) {
                resetGame();
            }
        }

        function resetGame() {
            obstacles = [];
            score = 0;
            gameSpeed = 6.2;
            obstacleInterval = 90;
            player.y = 250;
            player.dy = 0;
            isGameOver = false;
            isGameWon = false;
        }

        function spawnObstacle() {
            const rand = Math.random();
            let obs = { x: canvas.width };

            if (rand < 0.3) {
                obs.type = "singleSpike";
                obs.width = 30;
                obs.height = 35;
                obs.y = 310;
            } else if (rand < 0.55) {
                obs.type = "doubleSpike";
                obs.width = 60;
                obs.height = 35;
                obs.y = 310;
            } else {
                obs.type = "stairsPlatform";
                obs.width = 110;
                obs.height = 25;
                obs.y = 270;
            }

            obstacles.push(obs);
        }

        function update() {
            if (isGameOver || isGameWon) return;

            player.dy += player.gravity;
            player.y += player.dy;

            const groundLevel = 340 - player.size;
            let onGround = false;

            if (player.y >= groundLevel) {
                player.y = groundLevel;
                player.dy = 0;
                onGround = true;
            }

            for (let obs of obstacles) {
                if (obs.type === "stairsPlatform") {
                    if (
                        player.x + player.size > obs.x &&
                        player.x < obs.x + obs.width &&
                        player.y + player.size >= obs.y &&
                        player.y + player.size <= obs.y + 18 &&
                        player.dy >= 0
                    ) {
                        player.y = obs.y - player.size;
                        player.dy = 0;
                        onGround = true;
                    }

                    let padding = 4;
                    if (
                        player.x + player.size - padding > obs.x &&
                        player.x + padding < obs.x + obs.width &&
                        player.y + player.size > obs.y + 5 &&
                        player.y < obs.y + obs.height
                    ) {
                        if (player.x + player.size - player.dx <= obs.x + 5) {
                            isGameOver = true;
                        }
                    }
                }
            }

            if (onGround) {
                player.grounded = true;
                player.rotation = Math.round(player.rotation / 90) * 90;
            } else {
                player.grounded = false;
                player.rotation += 12;
            }

            obstacleTimer++;
            if (obstacleTimer >= obstacleInterval) {
                spawnObstacle();
                obstacleTimer = 0;
                if (obstacleInterval > 55) obstacleInterval -= 2;
            }

            for (let i = obstacles.length - 1; i >= 0; i--) {
                obstacles[i].x -= gameSpeed;

                let padding = 4;
                if (obstacles[i].type === "singleSpike" || obstacles[i].type === "doubleSpike") {
                    if (
                        player.x + padding < obstacles[i].x + obstacles[i].width - padding &&
                        player.x + player.size - padding > obstacles[i].x + padding &&
                        player.y + padding < obstacles[i].y + obstacles[i].height &&
                        player.y + player.size > obstacles[i].y
                    ) {
                        isGameOver = true;
                    }
                }

                if (obstacles[i].x + obstacles[i].width < 0) {
                    obstacles.splice(i, 1);
                    score++;
                    if (score >= winningScore) {
                        isGameWon = true;
                    }
                    if (score % 5 === 0) gameSpeed += 0.4;
                }
            }
        }

        function drawBackground() {
            let gradient = ctx.createLinearGradient(0, 0, 0, canvas.height);
            if (selectedBgType === "ocean") {
                gradient.addColorStop(0, "#03045e");
                gradient.addColorStop(1, "#0077b6");
            } else if (selectedBgType === "darkspace") {
                gradient.addColorStop(0, "#4a0e4e");
                gradient.addColorStop(1, "#000000");
            } else if (selectedBgType === "sunset") {
                gradient.addColorStop(0, "#833ab4");
                gradient.addColorStop(1, "#fd1d1d");
            }
            ctx.fillStyle = gradient;
            ctx.fillRect(0, 0, canvas.width, canvas.height);
        }

        function drawSpike(x, y, w, h) {
            ctx.fillStyle = "#023e8a";
            ctx.beginPath();
            ctx.moveTo(x, y + h);
            ctx.lineTo(x + w / 2, y);
            ctx.lineTo(x + w, y + h);
            ctx.closePath();
            ctx.fill();

            ctx.fillStyle = "#ffb703";
            ctx.beginPath();
            ctx.moveTo(x + 4, y + h);
            ctx.lineTo(x + w / 2, y + 6);
            ctx.lineTo(x + w - 4, y + h);
            ctx.closePath();
            ctx.fill();

            ctx.strokeStyle = "#ffffff";
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.moveTo(x, y + h);
            ctx.lineTo(x + w / 2, y);
            ctx.lineTo(x + w, y + h);
            ctx.closePath();
            ctx.stroke();
        }

        function drawPlayer() {
            ctx.save();
            ctx.translate(player.x + player.size / 2, player.y + player.size / 2);
            ctx.rotate((player.rotation * Math.PI) / 180);

            if (selectedPlayerShape === "cube") {
                ctx.fillStyle = selectedPlayerColor;
                ctx.fillRect(-player.size / 2, -player.size / 2, player.size, player.size);
                ctx.strokeStyle = "#ffffff";
                ctx.lineWidth = 3;
                ctx.strokeRect(-player.size / 2, -player.size / 2, player.size, player.size);
                ctx.fillStyle = "#ffffff";
                ctx.fillRect(-8, -8, 16, 16);
                ctx.fillStyle = selectedPlayerColor;
                ctx.fillRect(-4, -4, 8, 8);
            } 
            else if (selectedPlayerShape === "angel") {
                ctx.fillStyle = "#ffffff";
                ctx.fillRect(-player.size / 2 - 10, -8, 10, 16);
                ctx.fillRect(player.size / 2, -8, 10, 16);

                ctx.fillStyle = selectedPlayerColor;
                ctx.fillRect(-player.size / 2, -player.size / 2, player.size, player.size);
                ctx.strokeStyle = "#ffffff";
                ctx.lineWidth = 3;
                ctx.strokeRect(-player.size / 2, -player.size / 2, player.size, player.size);
                
                ctx.strokeStyle = "#ffeb3b";
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.arc(0, -player.size / 2 - 6, 8, 0, Math.PI * 2);
                ctx.stroke();
            } 
            else if (selectedPlayerShape === "ball") {
                ctx.fillStyle = selectedPlayerColor;
                ctx.beginPath();
                ctx.arc(0, 0, player.size / 2, 0, Math.PI * 2);
                ctx.fill();
                ctx.strokeStyle = "#ffffff";
                ctx.lineWidth = 3;
                ctx.stroke();
                
                ctx.fillStyle = "#ffffff";
                ctx.beginPath();
                ctx.arc(0, 0, 6, 0, Math.PI * 2);
                ctx.fill();
            } 
            else if (selectedPlayerShape === "superhero") {
                ctx.fillStyle = selectedPlayerColor;
                ctx.beginPath();
                ctx.moveTo(player.size / 2, 0);
                ctx.lineTo(-player.size / 2, -player.size / 2);
                ctx.lineTo(-player.size / 4, 0);
                ctx.lineTo(-player.size / 2, player.size / 2);
                ctx.closePath();
                ctx.fill();
                ctx.strokeStyle = "#ffffff";
                ctx.lineWidth = 3;
                ctx.stroke();
            }

            ctx.restore();
        }

        function draw() {
            drawBackground();

            // Mặt đất
            ctx.fillStyle = "#00b4d8";
            ctx.fillRect(0, 340, canvas.width, 60);
            ctx.strokeStyle = "#ffffff";
            ctx.lineWidth = 3;
            ctx.beginPath();
            ctx.moveTo(0, 340);
            ctx.lineTo(canvas.width, 340);
            ctx.stroke();

            drawPlayer();

            for (let obs of obstacles) {
                if (obs.type === "singleSpike") {
                    drawSpike(obs.x, obs.y, obs.width, obs.height);
                } 
                else if (obs.type === "doubleSpike") {
                    drawSpike(obs.x, obs.y, 30, obs.height);
                    drawSpike(obs.x + 30, obs.y, 30, obs.height);
                } 
                else if (obs.type === "stairsPlatform") {
                    ctx.fillStyle = "#023e8a";
                    ctx.fillRect(obs.x, obs.y, obs.width, obs.height);
                    ctx.strokeStyle = "#90e0ef";
                    ctx.lineWidth = 3;
                    ctx.strokeRect(obs.x, obs.y, obs.width, obs.height);

                    ctx.fillStyle = "#90e0ef";
                    ctx.fillRect(obs.x + 6, obs.y + 6, obs.width - 12, 6);
                }
            }

            // Thanh tiến độ điểm số
            ctx.fillStyle = "#ffffff";
            ctx.font = "bold 20px Arial";
            ctx.fillText("Progress: " + score + " / " + winningScore, 20, 30);

            // Màn hình Game Over
            if (isGameOver) {
                ctx.fillStyle = "rgba(0, 0, 0, 0.75)";
                ctx.fillRect(0, 0, canvas.width, canvas.height);

                ctx.fillStyle = "#ff3333";
                ctx.font = "bold 40px Arial";
                ctx.textAlign = "center";
                ctx.fillText("GAME OVER", canvas.width / 2, canvas.height / 2 - 20);

                ctx.fillStyle = "#ffffff";
                ctx.font = "18px Arial";
                ctx.fillText("Nhấn Space hoặc Click để thử lại", canvas.width / 2, canvas.height / 2 + 30);
                ctx.textAlign = "left";
            }

            // Màn hình Thắng cuộc
            if (isGameWon) {
                ctx.fillStyle = "rgba(0, 0, 0, 0.8)";
                ctx.fillRect(0, 0, canvas.width, canvas.height);

                ctx.fillStyle = "#48cae4";
                ctx.font = "bold 40px Arial";
                ctx.textAlign = "center";
                ctx.fillText("LEVEL COMPLETE!", canvas.width / 2, canvas.height / 2 - 20);

                ctx.fillStyle = "#ffffff";
                ctx.font = "18px Arial";
                ctx.fillText("Chúc mừng bạn đã hoàn thành màn chơi!", canvas.width / 2, canvas.height / 2 + 20);
                ctx.fillText("Nhấn Space hoặc Click để chơi lại", canvas.width / 2, canvas.height / 2 + 60);
                ctx.textAlign = "left";
            }
        }

        function loop() {
            if (!gameRunning) return;
            update();
            draw();
            requestAnimationFrame(loop);
        }
    </script>
</body>
</html>
