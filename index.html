<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Geometry Dash - Complete Edition</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
        }
        body {
            margin: 0;
            background-color: #050814;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
        }
        .screen {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
        }
        .hidden {
            display: none !important;
        }
        canvas {
            border: 4px solid #48cae4;
            box-shadow: 0 0 35px rgba(72, 202, 228, 0.5);
            background: linear-gradient(to bottom, #03045e, #0077b6);
            border-radius: 6px;
            cursor: pointer;
        }
        .menu-box {
            background: linear-gradient(135deg, #1d3557, #0b132b);
            padding: 30px 40px;
            border-radius: 16px;
            border: 2px solid #48cae4;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.7);
            max-width: 600px;
            width: 100%;
        }
        h1 {
            margin: 0 0 15px 0;
            color: #48cae4;
            font-size: 28px;
            text-shadow: 0 0 10px rgba(72,202,228,0.6);
            letter-spacing: 1px;
        }
        h3 {
            margin: 15px 0 8px 0;
            color: #a8dadc;
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .grid-container {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin-bottom: 10px;
        }
        .options-container {
            display: flex;
            gap: 12px;
            justify-content: center;
            margin-bottom: 15px;
            flex-wrap: wrap;
        }
        .btn-option {
            padding: 10px;
            background-color: #111827;
            border: 2px solid #374151;
            border-radius: 8px;
            cursor: pointer;
            font-size: 13px;
            font-weight: bold;
            color: #e5e7eb;
            transition: all 0.2s ease;
        }
        .btn-option:hover {
            border-color: #48cae4;
            background-color: #1f2937;
        }
        .btn-option.selected {
            border-color: #ffb703;
            background-color: #1e293b;
            box-shadow: 0 0 12px rgba(255, 183, 3, 0.6);
            color: #ffb703;
        }
        .color-circle {
            width: 40px;
            height: 40px;
            border: 3px solid #374151;
            border-radius: 50%;
            cursor: pointer;
            transition: transform 0.2s ease, border-color 0.2s ease;
        }
        .color-circle:hover {
            transform: scale(1.1);
        }
        .color-circle.selected {
            border-color: #ffb703;
            box-shadow: 0 0 15px #ffb703;
            transform: scale(1.15);
        }
        .start-btn {
            background: linear-gradient(135deg, #48cae4, #00b4d8);
            color: #03045e;
            font-weight: bold;
            font-size: 18px;
            padding: 12px 35px;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            margin-top: 15px;
            box-shadow: 0 4px 15px rgba(72,202,228,0.4);
            transition: transform 0.1s ease, background 0.2s ease;
        }
        .start-btn:hover {
            transform: translateY(-2px);
            background: linear-gradient(135deg, #00b4d8, #0077b6);
            color: #ffffff;
        }
        .start-btn:active {
            transform: translateY(1px);
        }
    </style>
</head>
<body>

    <!-- Menu Chọn Xe & Màu Sắc -->
    <div id="menuScreen" class="screen menu-box">
        <h1>GEOMETRY DASH - GARAGE</h1>
        
        <h3>Chọn Phương Tiện Ban Đầu:</h3>
        <div class="grid-container" id="shapeOptions">
            <div class="btn-option selected" data-shape="cube">🟦 Cube</div>
            <div class="btn-option" data-shape="ship">🚀 Ship</div>
            <div class="btn-option" data-shape="ball">🔮 Ball</div>
            <div class="btn-option" data-shape="ufo">🛸 UFO</div>
            <div class="btn-option" data-shape="wave">⚡ Wave</div>
            <div class="btn-option" data-shape="robot">🤖 Robot</div>
            <div class="btn-option" data-shape="spider">🕷️ Spider</div>
            <div class="btn-option" data-shape="swing">🪂 Swing</div>
            <div class="btn-option" data-shape="jetpack">🎒 Jetpack</div>
        </div>

        <h3>Chọn Màu Sắc Chủ Đạo:</h3>
        <div class="options-container" id="colorOptions">
            <div class="color-circle selected" style="background-color: #00ffcc;" data-color="#00ffcc"></div>
            <div class="color-circle" style="background-color: #ff3366;" data-color="#ff3366"></div>
            <div class="color-circle" style="background-color: #ffcc00;" data-color="#ffcc00"></div>
            <div class="color-circle" style="background-color: #9933ff;" data-color="#9933ff"></div>
            <div class="color-circle" style="background-color: #ff6600;" data-color="#ff6600"></div>
        </div>

        <button class="start-btn" onclick="startGame()">VÀO MÀN CHƠI</button>
    </div>

    <!-- Màn Hình Chơi Game -->
    <div id="gameScreen" class="screen hidden">
        <canvas id="gameCanvas" width="800" height="400"></canvas>
    </div>

    <script>
        const menuScreen = document.getElementById("menuScreen");
        const gameScreen = document.getElementById("gameScreen");
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");

        let config = {
            vehicle: "cube",
            color: "#00ffcc",
            speed: 5.5,
            winningScore: 40
        };

        let player = {
            x: 100,
            y: 250,
            size: 32,
            dy: 0,
            grounded: false,
            rotation: 0
        };

        let objects = [];
        let particles = [];
        let isHolding = false;
        let gravityDir = 1;
        let score = 0;
        let objectTimer = 0;
        let objectInterval = 75;
        let gameState = "MENU";

        // Xử lý chọn loại xe
        document.querySelectorAll("#shapeOptions .btn-option").forEach(btn => {
            btn.addEventListener("click", function() {
                document.querySelectorAll("#shapeOptions .btn-option").forEach(b => b.classList.remove("selected"));
                this.classList.add("selected");
                config.vehicle = this.getAttribute("data-shape");
            });
        });

        // Xử lý chọn màu
        document.querySelectorAll("#colorOptions .color-circle").forEach(btn => {
            btn.addEventListener("click", function() {
                document.querySelectorAll("#colorOptions .color-circle").forEach(b => b.classList.remove("selected"));
                this.classList.add("selected");
                config.color = this.getAttribute("data-color");
            });
        });

        function startGame() {
            menuScreen.classList.add("hidden");
            gameScreen.classList.remove("hidden");
            resetGame();
            gameState = "PLAYING";
            requestAnimationFrame(loop);
        }

        // Lắng nghe sự kiện bàn phím & chuột
        window.addEventListener("keydown", e => {
            if (e.code === "Space") {
                e.preventDefault();
                isHolding = true;
                handleAction();
            }
        });

        window.addEventListener("keyup", e => {
            if (e.code === "Space") isHolding = false;
        });

        canvas.addEventListener("mousedown", () => {
            isHolding = true;
            handleAction();
        });

        window.addEventListener("mouseup", () => {
            isHolding = false;
        });

        function handleAction() {
            if (gameState === "GAMEOVER" || gameState === "WON") {
                resetGame();
                gameState = "PLAYING";
                return;
            }

            if (config.vehicle === "cube" && player.grounded) {
                player.dy = -13.0 * gravityDir;
                player.grounded = false;
            } else if (config.vehicle === "ufo") {
                player.dy = -9.0 * gravityDir;
            } else if (config.vehicle === "ball") {
                gravityDir *= -1;
                player.dy = -5.0 * gravityDir;
            }
        }

        function resetGame() {
            objects = [];
            particles = [];
            score = 0;
            config.speed = 5.5;
            objectInterval = 75;
            gravityDir = 1;
            player.y = 250;
            player.dy = 0;
            player.rotation = 0;
            player.grounded = false;
        }

        // Sinh chướng ngại vật độc lập, riêng lẻ (mật độ trên không dày đặc khi chọn Ship/Jetpack)
        function spawnSingleObject() {
            const rand = Math.random();
            let x = canvas.width;

            if (config.vehicle === "ship" || config.vehicle === "jetpack") {
                if (rand < 0.45) {
                    objects.push({ type: "sawblade", x: x, y: Math.random() * 240 + 40, radius: 18, rotation: 0 });
                } else if (rand < 0.70) {
                    objects.push({ type: "block", x: x, width: 40, height: Math.random() * 90 + 40, y: Math.random() > 0.5 ? 0 : 190 });
                } else if (rand < 0.85) {
                    objects.push({ type: "orb", x: x, y: Math.random() * 200 + 70, radius: 14, collected: false });
                } else {
                    let targetVeh = Math.random() > 0.5 ? "cube" : "ship";
                    objects.push({ type: "portal", x: x, width: 30, height: 90, y: 200, target: targetVeh });
                }
            } else {
                if (rand < 0.20) {
                    objects.push({ type: "pit", x: x, width: 70, height: 60, y: 340 });
                } else if (rand < 0.38) {
                    objects.push({ type: "pad", x: x, width: 35, height: 15, y: 325 });
                } else if (rand < 0.55) {
                    objects.push({ type: "orb", x: x, y: 220, radius: 14, collected: false });
                } else if (rand < 0.72) {
                    objects.push({ type: "block", x: x, width: 45, height: 60, y: 280 });
                } else if (rand < 0.88) {
                    objects.push({ type: "sawblade", x: x, y: Math.random() * 180 + 100, radius: 18, rotation: 0 });
                } else {
                    let targetVeh = Math.random() > 0.5 ? "ship" : "cube";
                    objects.push({ type: "portal", x: x, width: 30, height: 90, y: 250, target: targetVeh });
                }
            }
        }

        function update() {
            if (gameState !== "PLAYING") return;

            // Vật lý phương tiện
            if (config.vehicle === "ship" || config.vehicle === "jetpack") {
                if (isHolding) {
                    player.dy -= 0.55 * gravityDir;
                } else {
                    player.dy += 0.55 * gravityDir;
                }
                player.dy = Math.max(-7.5, Math.min(7.5, player.dy));
                player.y += player.dy;
                player.rotation = player.dy * 4;
            } else if (config.vehicle === "wave") {
                player.dy = isHolding ? -6.5 * gravityDir : 6.5 * gravityDir;
                player.y += player.dy;
                player.rotation = isHolding ? -45 : 45;
            } else {
                player.dy += 0.85 * gravityDir;
                player.y += player.dy;
                player.rotation += 12 * gravityDir;
            }

            const groundLevel = 340 - player.size;
            let onGround = false;

            if (gravityDir === 1 && player.y >= groundLevel) {
                player.y = groundLevel;
                player.dy = 0;
                onGround = true;
            } else if (gravityDir === -1 && player.y <= 0) {
                player.y = 0;
                player.dy = 0;
                onGround = true;
            }

            // Giới hạn trần: bay quá cao (-100) mới tính thua
            if (player.y < -100) {
                gameState = "GAMEOVER";
            }

            // Tạo hiệu ứng hạt vệt sáng
            if (Math.random() < 0.4) {
                particles.push({
                    x: player.x,
                    y: player.y + player.size / 2,
                    size: Math.random() * 4 + 2,
                    color: config.color,
                    alpha: 1.0,
                    vx: -2 - Math.random() * 2,
                    vy: (Math.random() - 0.5) * 2
                });
            }
            particles.forEach(p => {
                p.x += p.vx;
                p.y += p.vy;
                p.alpha -= 0.05;
            });
            particles = particles.filter(p => p.alpha > 0);

            if (onGround) {
                player.grounded = true;
                if (config.vehicle === "cube") {
                    player.rotation = Math.round(player.rotation / 90) * 90;
                }
            } else {
                player.grounded = false;
            }

            objectTimer++;
            if (objectTimer >= objectInterval) {
                spawnSingleObject();
                objectTimer = 0;
                if (objectInterval > 50) objectInterval -= 2;
            }

            // Kiểm tra va chạm vật thể
            for (let i = objects.length - 1; i >= 0; i--) {
                let obj = objects[i];
                obj.x -= config.speed;

                let pad = 6;
                if (obj.type === "pit") {
                    if (player.x + player.size / 2 > obj.x && player.x + player.size / 2 < obj.x + obj.width) {
                        if (gravityDir === 1 && player.y >= groundLevel) gameState = "GAMEOVER";
                    }
                } else if (obj.type === "pad") {
                    if (player.x + player.size - pad > obj.x && player.x + pad < obj.x + obj.width &&
                        player.y + player.size >= obj.y && player.y <= obj.y + obj.height) {
                        player.dy = -16.0 * gravityDir;
                        player.grounded = false;
                    }
                } else if (obj.type === "orb") {
                    let dist = Math.hypot((player.x + player.size/2) - obj.x, (player.y + player.size/2) - obj.y);
                    if (dist < 30 && isHolding && !obj.collected) {
                        obj.collected = true;
                        player.dy = -14.0 * gravityDir;
                    }
                } else if (obj.type === "block") {
                    if (player.x + player.size - pad > obj.x && player.x + pad < obj.x + obj.width &&
                        player.y + player.size - pad > obj.y && player.y + pad < obj.y + obj.height) {
                        gameState = "GAMEOVER";
                    }
                } else if (obj.type === "sawblade") {
                    obj.rotation += 0.12;
                    let dist = Math.hypot((player.x + player.size/2) - obj.x, (player.y + player.size/2) - obj.y);
                    if (dist < player.size/2 + obj.radius - 6) {
                        gameState = "GAMEOVER";
                    }
                } else if (obj.type === "portal") {
                    if (player.x + player.size > obj.x && player.x < obj.x + obj.width &&
                        player.y + player.size > obj.y - obj.height/2 && player.y < obj.y + obj.height/2) {
                        config.vehicle = obj.target;
                        objects.splice(i, 1);
                        continue;
                    }
                }

                if (obj.x + (obj.width || 40) < 0) {
                    objects.splice(i, 1);
                    score++;
                    if (score >= config.winningScore) gameState = "WON";
                    if (score % 5 === 0) config.speed += 0.25;
                }
            }
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Vẽ hiệu ứng hạt
            particles.forEach(p => {
                ctx.fillStyle = p.color;
                ctx.globalAlpha = p.alpha;
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                ctx.fill();
            });
            ctx.globalAlpha = 1.0;

            // Vẽ mặt đất
            ctx.fillStyle = "#00b4d8";
            ctx.fillRect(0, 340, canvas.width, 60);
            ctx.strokeStyle = "#ffffff";
            ctx.lineWidth = 3;
            ctx.beginPath();
            ctx.moveTo(0, 340);
            ctx.lineTo(canvas.width, 340);
            ctx.stroke();

            // Vẽ các đối tượng
            objects.forEach(obj => {
                if (obj.type === "pit") {
                    ctx.fillStyle = "#03045e";
                    ctx.fillRect(obj.x, 338, obj.width, 65);
                } else if (obj.type === "pad") {
                    ctx.fillStyle = "#ff007f";
                    ctx.fillRect(obj.x, obj.y, obj.width, obj.height);
                    ctx.strokeStyle = "#fff";
                    ctx.strokeRect(obj.x, obj.y, obj.width, obj.height);
                } else if (obj.type === "orb" && !obj.collected) {
                    ctx.fillStyle = "#ffcc00";
                    ctx.beginPath();
                    ctx.arc(obj.x, obj.y, obj.radius, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.strokeStyle = "#fff";
                    ctx.lineWidth = 2;
                    ctx.stroke();
                } else if (obj.type === "block") {
                    ctx.fillStyle = "#1d3557";
                    ctx.fillRect(obj.x, obj.y, obj.width, obj.height);
                    ctx.strokeStyle = "#457b9d";
                    ctx.lineWidth = 3;
                    ctx.strokeRect(obj.x, obj.y, obj.width, obj.height);
                } else if (obj.type === "sawblade") {
                    ctx.save();
                    ctx.translate(obj.x, obj.y);
                    ctx.rotate(obj.rotation);
                    ctx.fillStyle = "#6b7280";
                    ctx.beginPath();
                    ctx.arc(0, 0, obj.radius, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.strokeStyle = "#fff";
                    ctx.lineWidth = 2;
                    ctx.stroke();
                    for(let c = 0; c < 8; c++) {
                        ctx.rotate(Math.PI / 4);
                        ctx.fillRect(-3, -obj.radius - 6, 6, 8);
                    }
                    ctx.restore();
                } else if (obj.type === "portal") {
                    ctx.fillStyle = obj.target === "ship" ? "rgba(255, 0, 100, 0.4)" : "rgba(0, 200, 255, 0.4)";
                    ctx.fillRect(obj.x, obj.y - obj.height/2, obj.width, obj.height);
                    ctx.strokeStyle = "#fff";
                    ctx.lineWidth = 3;
                    ctx.strokeRect(obj.x, obj.y - obj.height/2, obj.width, obj.height);
                }
            });

            // Vẽ nhân vật
            ctx.save();
            ctx.translate(player.x + player.size / 2, player.y + player.size / 2);
            ctx.rotate((player.rotation * Math.PI) / 180);

            if (config.vehicle === "ship" || config.vehicle === "jetpack") {
                ctx.fillStyle = config.color;
                ctx.beginPath();
                ctx.moveTo(-16, -10);
                ctx.lineTo(16, 0);
                ctx.lineTo(-16, 10);
                ctx.closePath();
                ctx.fill();
                ctx.strokeStyle = "#fff";
                ctx.lineWidth = 2;
                ctx.stroke();
                ctx.fillStyle = "#fff";
                ctx.beginPath();
                ctx.arc(0, 0, 5, 0, Math.PI * 2);
                ctx.fill();
            } else {
                ctx.fillStyle = config.color;
                ctx.fillRect(-player.size / 2, -player.size / 2, player.size, player.size);
                ctx.strokeStyle = "#fff";
                ctx.lineWidth = 3;
                ctx.strokeRect(-player.size / 2, -player.size / 2, player.size, player.size);
                ctx.fillStyle = "#fff";
                ctx.fillRect(-8, -8, 16, 16);
                ctx.fillStyle = config.color;
                ctx.fillRect(-4, -4, 8, 8);
            }
            ctx.restore();

            // Hiển thị thanh tiến trình
            ctx.fillStyle = "#ffffff";
            ctx.font = "bold 18px 'Segoe UI'";
            ctx.fillText(`Progress: ${score} / ${config.winningScore}`, 20, 30);

            // Màn hình kết quả (Game Over / Thắng)
            if (gameState === "GAMEOVER" || gameState === "WON") {
                ctx.fillStyle = "rgba(5, 8, 20, 0.85)";
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                ctx.textAlign = "center";
                
                ctx.fillStyle = gameState === "GAMEOVER" ? "#ef4444" : "#48cae4";
                ctx.font = "bold 42px 'Segoe UI'";
                ctx.fillText(gameState === "GAMEOVER" ? "GAME OVER" : "LEVEL COMPLETE!", canvas.width / 2, canvas.height / 2 - 20);
                
                ctx.fillStyle = "#ffffff";
                ctx.font = "18px 'Segoe UI'";
                ctx.fillText("Nhấn Space hoặc Click để chơi lại", canvas.width / 2, canvas.height / 2 + 30);
                ctx.textAlign = "left";
            }
        }

        function loop() {
            update();
            draw();
            if (gameState === "PLAYING" || gameState === "GAMEOVER" || gameState === "WON") {
                requestAnimationFrame(loop);
            }
        }
    </script>
</body>
</html>
