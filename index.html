<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Geometry Dash - Fixed Version</title>
    <style>
        body {
            margin: 0;
            background-color: #0b132b;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            color: white;
            font-family: Arial, sans-serif;
            overflow: hidden;
            user-select: none;
        }
        .screen {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
        }
        .hidden {
            display: none !important;
        }
        canvas {
            border: 4px solid #48cae4;
            box-shadow: 0 0 25px rgba(72, 202, 228, 0.4);
            cursor: pointer;
        }
        .menu-box {
            background: #1d3557;
            padding: 20px 30px;
            border-radius: 12px;
            border: 2px solid #457b9d;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            max-width: 550px;
        }
        h1 { margin-bottom: 10px; color: #48cae4; font-size: 24px; }
        h3 { margin: 8px 0 5px 0; color: #a8dadc; font-size: 14px; }
        .grid-container {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
            margin-bottom: 10px;
        }
        .options-container {
            display: flex;
            gap: 8px;
            justify-content: center;
            margin-bottom: 8px;
            flex-wrap: wrap;
        }
        .btn-option {
            padding: 8px 10px;
            background-color: #2b2b3d;
            border: 2px solid #fff;
            border-radius: 6px;
            cursor: pointer;
            font-size: 12px;
            font-weight: bold;
            color: #fff;
        }
        .btn-option.selected {
            border-color: #ffb703;
            background-color: #3b3b5c;
            box-shadow: 0 0 8px #ffb703;
        }
        .color-circle {
            width: 35px;
            height: 35px;
            border: 3px solid #fff;
            border-radius: 50%;
            cursor: pointer;
        }
        .color-circle.selected {
            border-color: #ffb703;
            box-shadow: 0 0 10px #ffb703;
        }
        .start-btn {
            background-color: #48cae4;
            color: #03045e;
            font-weight: bold;
            font-size: 16px;
            padding: 10px 25px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            margin-top: 10px;
        }
        .start-btn:hover {
            background-color: #00b4d8;
        }
    </style>
</head>
<body>

    <div id="menuScreen" class="screen menu-box">
        <h1>BACK ON TRACK - GARAGE</h1>
        
        <h3>Chọn Phương Tiện:</h3>
        <div class="grid-container" id="shapeOptions">
            <div class="btn-option selected" data-shape="cube">🟦 Cube</div>
            <div class="btn-option" data-shape="ship">🚀 Ship</div>
            <div class="btn-option" data-shape="ball">🔮 Ball</div>
            <div class="btn-option" data-shape="ufo">🛸 UFO</div>
            <div class="btn-option" data-shape="wave">⚡ Wave</div>
            <div class="btn-option" data-shape="robot">🤖 Robot</div>
            <div class="btn-option" data-shape="spider">🕷️ Spider</div>
            <div class="btn-option" data-shape="swing">🪂 Swing</div>
            <div class="btn-option" data-shape="jetpack">🎒 Jetpack</div>
        </div>

        <h3>Chọn Màu Sắc:</h3>
        <div class="options-container" id="colorOptions">
            <div class="color-circle selected" style="background-color: #00ffcc;" data-color="#00ffcc"></div>
            <div class="color-circle" style="background-color: #ff3366;" data-color="#ff3366"></div>
            <div class="color-circle" style="background-color: #ffcc00;" data-color="#ffcc00"></div>
            <div class="color-circle" style="background-color: #9933ff;" data-color="#9933ff"></div>
            <div class="color-circle" style="background-color: #ff6600;" data-color="#ff6600"></div>
        </div>

        <button class="start-btn" onclick="startGame()">VÀO MÀN CHƠI</button>
    </div>

    <div id="gameScreen" class="screen hidden">
        <canvas id="gameCanvas" width="800" height="400"></canvas>
    </div>

    <script>
        const menuScreen = document.getElementById("menuScreen");
        const gameScreen = document.getElementById("gameScreen");
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");

        let selectedVehicle = "cube";
        let selectedColor = "#00ffcc";
        let particleEffects = [];
        let isHolding = false;

        document.querySelectorAll("#shapeOptions .btn-option").forEach(btn => {
            btn.addEventListener("click", function() {
                document.querySelectorAll("#shapeOptions .btn-option").forEach(b => b.classList.remove("selected"));
                this.classList.add("selected");
                selectedVehicle = this.getAttribute("data-shape");
            });
        });

        document.querySelectorAll("#colorOptions .color-circle").forEach(btn => {
            btn.addEventListener("click", function() {
                document.querySelectorAll("#colorOptions .color-circle").forEach(b => b.classList.remove("selected"));
                this.classList.add("selected");
                selectedColor = this.getAttribute("data-color");
            });
        });

        let player = {
            x: 100,
            y: 250,
            size: 32,
            dy: 0,
            grounded: false,
            rotation: 0
        };

        let obstacles = [];
        let obstacleTimer = 0;
        let obstacleInterval = 90;
        let gameSpeed = 6.0;
        let score = 0;
        let winningScore = 30;
        let isGameOver = false;
        let isGameWon = false;
        let gameRunning = false;

        function startGame() {
            menuScreen.classList.add("hidden");
            gameScreen.classList.remove("hidden");
            resetGame();
            if (!gameRunning) {
                gameRunning = true;
                requestAnimationFrame(loop);
            }
        }

        // Lắng nghe sự kiện bàn phím và chuột trực quan an toàn
        window.addEventListener("keydown", function(e) {
            if (e.code === "Space") {
                e.preventDefault();
                isHolding = true;
                handleAction();
            }
        });

        window.addEventListener("keyup", function(e) {
            if (e.code === "Space") {
                isHolding = false;
            }
        });

        canvas.addEventListener("mousedown", function() {
            isHolding = true;
            handleAction();
        });

        window.addEventListener("mouseup", function() {
            isHolding = false;
        });

        function handleAction() {
            if (isGameOver || isGameWon) {
                resetGame();
                return;
            }

            if (selectedVehicle === "cube" && player.grounded) {
                player.dy = -13.0;
                player.grounded = false;
            } else if (selectedVehicle === "ufo") {
                player.dy = -9.0;
            } else if (selectedVehicle === "spider") {
                player.y = player.y > 200 ? 100 : 280;
            }
        }

        function resetGame() {
            obstacles = [];
            particleEffects = [];
            score = 0;
            gameSpeed = 6.0;
            obstacleInterval = 90;
            player.y = 250;
            player.dy = 0;
            isGameOver = false;
            isGameWon = false;
        }

        function spawnObstacle() {
            const rand = Math.random();
            let obs = { x: canvas.width };

            if (rand < 0.35) {
                obs.type = "singleSpike";
                obs.width = 30;
                obs.height = 35;
                obs.y = 310;
            } else if (rand < 0.6) {
                obs.type = "doubleSpike";
                obs.width = 60;
                obs.height = 35;
                obs.y = 310;
            } else {
                obs.type = "stairsPlatform";
                obs.width = 110;
                obs.height = 25;
                obs.y = 270;
            }
            obstacles.push(obs);
        }

        function update() {
            if (isGameOver || isGameWon) return;

            // Vật lý theo phương tiện
            if (selectedVehicle === "ship" || selectedVehicle === "jetpack") {
                if (isHolding) {
                    player.dy -= 0.6;
                } else {
                    player.dy += 0.6;
                }
                player.dy = Math.max(-8, Math.min(8, player.dy));
                player.y += player.dy;
                player.rotation = player.dy * 4;
            } else if (selectedVehicle === "wave") {
                if (isHolding) {
                    player.dy = -6.5;
                } else {
                    player.dy = 6.5;
                }
                player.y += player.dy;
                player.rotation = isHolding ? -45 : 45;
            } else {
                player.dy += 0.85;
                player.y += player.dy;
                player.rotation += 12;
            }

            const groundLevel = 340 - player.size;
            let onGround = false;

            if (player.y >= groundLevel) {
                player.y = groundLevel;
                player.dy = 0;
                onGround = true;
            }

            if (player.y <= 0) {
                player.y = 0;
                player.dy = 0;
            }

            // Tạo hiệu ứng hạt vệt sáng
            if (Math.random() < 0.5) {
                particleEffects.push({
                    x: player.x,
                    y: player.y + player.size / 2,
                    size: Math.random() * 5 + 3,
                    color: selectedColor,
                    alpha: 1.0,
                    vx: -2 - Math.random() * 2,
                    vy: (Math.random() - 0.5) * 2
                });
            }

            for (let p of particleEffects) {
                p.x += p.vx;
                p.y += p.vy;
                p.alpha -= 0.05;
            }
            particleEffects = particleEffects.filter(p => p.alpha > 0);

            for (let obs of obstacles) {
                if (obs.type === "stairsPlatform" && selectedVehicle === "cube") {
                    if (
                        player.x + player.size > obs.x &&
                        player.x < obs.x + obs.width &&
                        player.y + player.size >= obs.y &&
                        player.y + player.size <= obs.y + 18 &&
                        player.dy >= 0
                    ) {
                        player.y = obs.y - player.size;
                        player.dy = 0;
                        onGround = true;
                    }
                }
            }

            if (onGround) {
                player.grounded = true;
                if (selectedVehicle === "cube") {
                    player.rotation = Math.round(player.rotation / 90) * 90;
                }
            } else {
                player.grounded = false;
            }

            obstacleTimer++;
            if (obstacleTimer >= obstacleInterval) {
                spawnObstacle();
                obstacleTimer = 0;
                if (obstacleInterval > 55) obstacleInterval -= 3;
            }

            for (let i = obstacles.length - 1; i >= 0; i--) {
                obstacles[i].x -= gameSpeed;

                let pad = 6;
                if (
                    player.x + pad < obstacles[i].x + obstacles[i].width - pad &&
                    player.x + player.size - pad > obstacles[i].x + pad &&
                    player.y + pad < obstacles[i].y + obstacles[i].height &&
                    player.y + player.size > obstacles[i].y
                ) {
                    isGameOver = true;
                }

                if (obstacles[i].x + obstacles[i].width < 0) {
                    obstacles.splice(i, 1);
                    score++;
                    if (score >= winningScore) {
                        isGameWon = true;
                    }
                    if (score % 5 === 0) gameSpeed += 0.3;
                }
            }
        }

        function draw() {
            let gradient = ctx.createLinearGradient(0, 0, 0, canvas.height);
            gradient.addColorStop(0, "#03045e");
            gradient.addColorStop(1, "#0077b6");
            ctx.fillStyle = gradient;
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            for (let p of particleEffects) {
                ctx.fillStyle = p.color;
                ctx.globalAlpha = p.alpha;
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                ctx.fill();
            }
            ctx.globalAlpha = 1.0;

            ctx.fillStyle = "#00b4d8";
            ctx.fillRect(0, 340, canvas.width, 60);
            ctx.strokeStyle = "#ffffff";
            ctx.lineWidth = 3;
            ctx.beginPath();
            ctx.moveTo(0, 340);
            ctx.lineTo(canvas.width, 340);
            ctx.stroke();

            // Vẽ nhân vật
            ctx.save();
            ctx.translate(player.x + player.size / 2, player.y + player.size / 2);
            ctx.rotate((player.rotation * Math.PI) / 180);
            ctx.fillStyle = selectedColor;
            ctx.fillRect(-player.size / 2, -player.size / 2, player.size, player.size);
            ctx.strokeStyle = "#ffffff";
            ctx.lineWidth = 3;
            ctx.strokeRect(-player.size / 2, -player.size / 2, player.size, player.size);
            ctx.fillStyle = "#ffffff";
            ctx.fillRect(-8, -8, 16, 16);
            ctx.fillStyle = selectedColor;
            ctx.fillRect(-4, -4, 8, 8);
            ctx.restore();

            // Vẽ chướng ngại vật
            for (let obs of obstacles) {
                if (obs.type === "singleSpike" || obs.type === "doubleSpike") {
                    let count = obs.type === "doubleSpike" ? 2 : 1;
                    let w = obs.type === "doubleSpike" ? 30 : 30;
                    for(let k=0; k<count; k++) {
                        let curX = obs.x + (k * 30);
                        ctx.fillStyle = "#023e8a";
                        ctx.beginPath();
                        ctx.moveTo(curX, obs.y + obs.height);
                        ctx.lineTo(curX + w / 2, obs.y);
                        ctx.lineTo(curX + w, obs.y + obs.height);
                        ctx.closePath();
                        ctx.fill();

                        ctx.fillStyle = "#ffb703";
                        ctx.beginPath();
                        ctx.moveTo(curX + 4, obs.y + obs.height);
                        ctx.lineTo(curX + w / 2, obs.y + 6);
                        ctx.lineTo(curX + w - 4, obs.y + obs.height);
                        ctx.closePath();
                        ctx.fill();

                        ctx.strokeStyle = "#ffffff";
                        ctx.lineWidth = 2;
                        ctx.stroke();
                    }
                } else {
                    ctx.fillStyle = "#023e8a";
                    ctx.fillRect(obs.x, obs.y, obs.width, obs.height);
                    ctx.strokeStyle = "#90e0ef";
                    ctx.lineWidth = 3;
                    ctx.strokeRect(obs.x, obs.y, obs.width, obs.height);
                    ctx.fillStyle = "#90e0ef";
                    ctx.fillRect(obs.x + 6, obs.y + 6, obs.width - 12, 6);
                }
            }

            ctx.fillStyle = "#ffffff";
            ctx.font = "bold 20px Arial";
            ctx.fillText("Progress: " + score + " / " + winningScore, 20, 30);

            if (isGameOver) {
                ctx.fillStyle = "rgba(0, 0, 0, 0.75)";
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                ctx.fillStyle = "#ff3333";
                ctx.font = "bold 40px Arial";
                ctx.textAlign = "center";
                ctx.fillText("GAME OVER", canvas.width / 2, canvas.height / 2 - 20);
                ctx.fillStyle = "#ffffff";
                ctx.font = "18px Arial";
                ctx.fillText("Nhấn Space hoặc Click để thử lại", canvas.width / 2, canvas.height / 2 + 30);
                ctx.textAlign = "left";
            }

            if (isGameWon) {
                ctx.fillStyle = "rgba(0, 0, 0, 0.8)";
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                ctx.fillStyle = "#48cae4";
                ctx.font = "bold 40px Arial";
                ctx.textAlign = "center";
                ctx.fillText("LEVEL COMPLETE!", canvas.width / 2, canvas.height / 2 - 20);
                ctx.fillStyle = "#ffffff";
                ctx.font = "18px Arial";
                ctx.fillText("Chúc mừng bạn đã hoàn thành màn chơi!", canvas.width / 2, canvas.height / 2 + 20);
                ctx.fillText("Nhấn Space hoặc Click để chơi lại", canvas.width / 2, canvas.height / 2 + 60);
                ctx.textAlign = "left";
            }
        }

        function loop() {
            if (gameRunning) {
                update();
                draw();
                requestAnimationFrame(loop);
            }
        }
    </script>
</body>
</html>
