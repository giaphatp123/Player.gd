<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Geometry Dash - Perfect Master Edition</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
        }
        body {
            margin: 0;
            background-color: #050814;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
        }
        .screen {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
        }
        .hidden {
            display: none !important;
        }
        canvas {
            border: 4px solid #48cae4;
            box-shadow: 0 0 35px rgba(72, 202, 228, 0.5);
            background: linear-gradient(to bottom, #03045e, #0077b6);
            border-radius: 6px;
            cursor: pointer;
        }
        .menu-box {
            background: linear-gradient(135deg, #1d3557, #0b132b);
            padding: 30px 40px;
            border-radius: 16px;
            border: 2px solid #48cae4;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.7);
            max-width: 600px;
            width: 100%;
        }
        h1 {
            margin: 0 0 10px 0;
            color: #48cae4;
            font-size: 32px;
            text-shadow: 0 0 15px rgba(72,202,228,0.7);
            letter-spacing: 2px;
        }
        h2 {
            margin: 0 0 20px 0;
            color: #ffb703;
            font-size: 22px;
            text-shadow: 0 0 10px rgba(255,183,3,0.5);
        }
        h3 {
            margin: 15px 0 8px 0;
            color: #a8dadc;
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .grid-container {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin-bottom: 10px;
        }
        .options-container {
            display: flex;
            gap: 12px;
            justify-content: center;
            margin-bottom: 15px;
            flex-wrap: wrap;
        }
        .btn-option {
            padding: 10px;
            background-color: #111827;
            border: 2px solid #374151;
            border-radius: 8px;
            cursor: pointer;
            font-size: 13px;
            font-weight: bold;
            color: #e5e7eb;
            transition: all 0.2s ease;
        }
        .btn-option:hover {
            border-color: #48cae4;
            background-color: #1f2937;
        }
        .btn-option.selected {
            border-color: #ffb703;
            background-color: #1e293b;
            box-shadow: 0 0 12px rgba(255, 183, 3, 0.6);
            color: #ffb703;
        }
        .color-circle {
            width: 40px;
            height: 40px;
            border: 3px solid #374151;
            border-radius: 50%;
            cursor: pointer;
            transition: transform 0.2s ease, border-color 0.2s ease;
        }
        .color-circle:hover {
            transform: scale(1.1);
        }
        .color-circle.selected {
            border-color: #ffb703;
            box-shadow: 0 0 15px #ffb703;
            transform: scale(1.15);
        }
        .ui-btn {
            background: linear-gradient(135deg, #48cae4, #00b4d8);
            color: #03045e;
            font-weight: bold;
            font-size: 18px;
            padding: 12px 30px;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            margin: 8px;
            box-shadow: 0 4px 15px rgba(72,202,228,0.4);
            transition: transform 0.1s ease, background 0.2s ease;
            width: 220px;
        }
        .ui-btn:hover {
            transform: translateY(-2px);
            background: linear-gradient(135deg, #00b4d8, #0077b6);
            color: #ffffff;
        }
        .ui-btn:active {
            transform: translateY(1px);
        }
        .btn-back {
            background: linear-gradient(135deg, #6c757d, #495057);
            color: #ffffff;
        }
        .btn-back:hover {
            background: linear-gradient(135deg, #495057, #343a40);
        }
        .desc-text {
            color: #a8dadc;
            font-size: 14px;
            line-height: 1.6;
            margin-bottom: 20px;
            text-align: left;
            background: rgba(0,0,0,0.2);
            padding: 12px;
            border-radius: 8px;
        }
    </style>
</head>
<body>

    <!-- THẺ AUDIO NHẠC NỀN -->
    <audio id="bgMusic" loop>

    </audio>
